# =====================================================================
# cut_new.yaml — 실측 기반으로 다시 만든 페이지 컷 템플릿 20종 (범용판)
# =====================================================================
# 근거: 268면(일본식 만화 단행본, 1198×1681px)을 기하 계측 + 비전 LLM으로 분석한 결과
#       → 리포트 `cut_report.md`, 데이터 `analysis_cut/pages.json`
#
# [그림에서 읽은 실제 습관] (268면 / 1,242컷 실측)
#   · 페이지당 컷: 평균 4.6컷 — 4~6컷이 74%, 3단 구성이 65%(2단 24%, 4단 4%, 1컷 7%)
#   · 최다 구조: 2/2/2(56면) · 2/2/1(40면) · 2/2(20면) · 1/2/2(18면) · 2/1/1(15면)
#   · 3단에서 가장 높은 행: 맨 아래 82면 / 맨 위 64면 / 가운데 28면 → 가운데 행을 얇게 누른다
#   · 2칸 행은 55/45 기준으로 62%가 폭차 ≥8%p(역할이 다른 두 컷을 한 행에)
#   · 전폭(행에 칸 하나) 행이 716행 중 32%, 몰아치기(타치키리) 컷 79% → 컷을 면까지 밀어 쓴다
#   · 화각: 상반신 38% · 가슴위 20% · 클로즈업 18% · 전신 14% · 풍경 6% (전신은 등장/이동/행동 전용에 가까움)
#   · 좁은 칸(폭<35%)의 63%는 클로즈업·부분 컷, 얇은 행(높이<22%)은 무자막/효과음/부분 클로즈업 전용
#   · 풍경(인물 없는) 컷의 60%가 첫 행 → 상황 제시 페이지(컷 3.8개, 대사 24%)는 넓고 적게
#
# [스키마] — 기존 data/cut.yaml 을 그대로 유지하므로 로더 수정 없이 교체할 수 있습니다.
#   tier `shares`  : 행 안 좌→우 폭 비율(합 1.0)                      ← 기존 키
#   tier `height`  : (선택) 페이지 높이 중 이 행 비율(행들 합 1.0)      ← 기존 키
#   tier `center`  : (선택) true = 좌우 여백을 두고 중앙만             ← 기존 키
#   tier `role`    : (선택) "summary" | "epilogue" 화면 문법 역할       ← 기존 키
#   tier `gen`     : ★신규 — 이미지 생성에 **요청**하는 사항, shares 와 1:1 순서
#                     shot  : full_body(전신,머리~발끝) | upper_body(상반신) | bust(가슴~위)
#                             | closeup(눈·입·손 등 부분) | scenery(인물 없는 배경) | object(소품) | crowd(3인+)
#                     angle : eye_level | low(버드업) | high(조감) | pov(1인칭)
#                     chars : 화면 속 인물 수(0~3, 3 이상은 crowd 로)
#                     bg    : detailed(배경 정밀) | simple(단순) | black(흑면) | tone(톤·효과선)
#                     text  : dialog(대사풍선) | mono(독백/설명) | sfx(효과문자) | none(무자막)
#                     ask   : (선택) 위 태그로 다 못 하는 추가 요청(한국어 한 줄)
#   template `gen_page` : ★신규 — 페이지 단위 생성 요청(블리드·가터 색·통문법)
#   template `observed` : ★신규 — 이 템플릿 구조에 해당하는 면이 작품에서 몇 면 관측됐는지(근거 강도).
#                     값은 `analysis_cut/match.py` 의 구조 조건으로 계산했습니다(0 = 관측 없는 확장안).
#                     한 템플릿이 여러 구조 서명을 허용하면 그 합계입니다.
#
# [코드가 읽는 방법] comic_gen.load_cut_templates() 는 아래 키들을 그대로 슬롯에 실어서
#   컷 스크립트 LLM / anima_gen 프롬프트 조립에 넘기면 됩니다. 미지정 키를 무시하는 로더라
#   지금 이 파일을 data/cut.yaml 자리에 두어도 동작에는 지장이 없습니다.
# =====================================================================

manga_panel_templates:

  # ───────────────────────── 1) 기본 3단 6컷 (실측 56면, 최다)
  # 행 높이 0.35/0.30/0.35 — 가운데 행을 살짝 눌러 위·아래를 크게 쓰는 이 작품의 표준 문법.
  # 모든 대화·행동 씬의 기준 템플릿(범용).situations 를 4단계 전부 열었습니다.
  - id: std_3tier_6panel
    name: "표준 3단 6컷 (가운데 눌리기)"
    situations: ["기", "승", "전", "결"]
    total_size: "1 Page"
    total_tiers: 3
    observed: 56
    gen_page: "컷은 면 끝까지 밀어 쓴다(타치키리). 행 높이 35/30/35, 각 행은 55:45 안팎으로 비대칭."
    tier_details:
      - tier: 1
        shares: [0.55, 0.45]
        height: 0.35
        description: "2컷 분할(55/45) - 상황을 여는 두 사람 / 넓이 큰 쪽에서 사건을 제시하고 좁은 쪽에서 상대를 보여줌"
        gen:
          - {shot: upper_body, angle: eye_level, chars: 1, bg: detailed, text: dialog}
          - {shot: bust,       angle: eye_level, chars: 1, bg: simple,   text: dialog}
      - tier: 2
        shares: [0.5, 0.5]
        height: 0.30
        description: "2컷 분할(50/50) - 받아치기와 리액션. 이 행은 높이가 가장 낮으므로 표정·상체 위주로"
        gen:
          - {shot: bust,     angle: eye_level, chars: 1, bg: simple,  text: dialog}
          - {shot: closeup,  angle: eye_level, chars: 1, bg: simple,  text: dialog}
      - tier: 3
        shares: [0.6, 0.4]
        height: 0.35
        description: "2컷 분할(60/40) - 행동을 시작하거나 다음 페이지로 넘기는 마무리"
        gen:
          - {shot: upper_body, angle: eye_level, chars: 2, bg: detailed, text: dialog, ask: "두 인물이 같은 화면, 허리 위까지"}
          - {shot: closeup,    angle: high,      chars: 1, bg: simple,   text: none}

  # ───────────────────────── 2) 3단 5컷 · 마무리 전폭 (실측 40면)
  # 아래 행을 통째로 써서 장면 종료를 넓게 벌립니다(마지막 행이 전폭인 면이 전체의 41%).
  - id: std_3tier_5panel_close
    name: "3단 5컷 · 마무리 전폭"
    situations: ["승", "전", "결"]
    total_size: "1 Page"
    total_tiers: 3
    observed: 40
    gen_page: "3번째 행은 페이지 폭 전체를 쓰는 한 컷. 컷이 크므로 인물을 화면 가장자리에 오려 붙이지 말고, 배경도 완전히 비우지는 말 것."
    tier_details:
      - tier: 1
        shares: [0.55, 0.45]
        height: 0.35
        description: "2컷 분할(55/45) - 첫 대사 교환"
        gen:
          - {shot: upper_body, angle: eye_level, chars: 1, bg: detailed, text: dialog}
          - {shot: bust,       angle: eye_level, chars: 1, bg: simple,   text: dialog}
      - tier: 2
        shares: [0.55, 0.45]
        height: 0.30
        description: "2컷 분할(55/45) - 텐션이 오르는 두 번째 교환(한쪽은 클로즈업)"
        gen:
          - {shot: bust,    angle: eye_level, chars: 1, bg: simple, text: dialog}
          - {shot: closeup, angle: eye_level, chars: 1, bg: tone,   text: sfx}
      - tier: 3
        shares: [1.0]
        height: 0.35
        description: "1컷 전폭(100%) - 이 페이지에서 가장 큰 컷. 행동의 결과·동반 컷"
        gen:
          - {shot: full_body, angle: eye_level, chars: 2, bg: detailed, text: dialog, ask: "머리부터 발끝까지, 두 인물의 전신 관계가 보이는 구도"}

  # ───────────────────────── 3) 3단 5컷 · 오프닝 전폭 (실측 18면)
  # 첫 행 전폭인 면이 29%. 풍경(인물 없음) 컷의 60%가 첫 행에 놓입니다.
  - id: std_3tier_5panel_open
    name: "3단 5컷 · 오프닝 전폭 (장소 제시)"
    situations: ["기", "승"]
    total_size: "1 Page"
    total_tiers: 3
    observed: 18
    gen_page: "첫 행은 배경 밀도를 높이고(정밀 배경) 대사 대신 설명 박스/무자막. 남은 두 행은 배경을 단순화해 대비합니다."
    tier_details:
      - tier: 1
        shares: [1.0]
        height: 0.35
        description: "1컷 전폭(100%) - 시간·장소·분위기를 잡는 확립 컷"
        gen:
          - {shot: scenery, angle: high, chars: 0, bg: detailed, text: mono, ask: "인물 없이 배경만, 또는 뒷모습만 작게"}
      - tier: 2
        shares: [0.55, 0.45]
        height: 0.30
        description: "2컷 분할(55/45) - 인물 등장, 첫 행동"
        gen:
          - {shot: upper_body, angle: eye_level, chars: 1, bg: simple, text: dialog}
          - {shot: bust,       angle: eye_level, chars: 1, bg: simple, text: none}
      - tier: 3
        shares: [0.55, 0.45]
        height: 0.35
        description: "2컷 분할(55/45) - 상황 설명을 끝내고 다음 장면으로 넘김"
        gen:
          - {shot: upper_body, angle: eye_level, chars: 2, bg: simple, text: dialog}
          - {shot: closeup,    angle: eye_level, chars: 1, bg: simple, text: none}

  # ───────────────────────── 4) 3단 4컷 · 마무리 전폭 (실측 15면)
  # 컷 수가 적어 호흡이 느립니다. 감정 전환·대면 후 정리에 쓰입니다.
  - id: std_3tier_4panel_close
    name: "3단 4컷 · 아래 두 행 전폭"
    situations: ["승", "결"]
    total_size: "1 Page"
    total_tiers: 3
    observed: 15
    gen_page: "행 2·3이 각각 전폭(한 컷)입니다. 컷이 크므로 표정 변화·몸 전체 동작을 정확히 요구하고, 자막은 컷당 1개로 억제."
    tier_details:
      - tier: 1
        shares: [0.55, 0.45]
        height: 0.38
        description: "2컷 분할(55/45) - 두 사람의 엇갈림"
        gen:
          - {shot: upper_body, angle: eye_level, chars: 1, bg: simple, text: dialog}
          - {shot: bust,       angle: eye_level, chars: 1, bg: simple, text: dialog}
      - tier: 2
        shares: [1.0]
        height: 0.28
        description: "1컷 전폭 - 행동을 개시하는 컷(가벼운 로우 앵글로 힘을 줌)"
        gen:
          - {shot: full_body, angle: low, chars: 1, bg: simple, text: none, ask: "머리~발끝, 한 인물의 동작 시작"}
      - tier: 3
        shares: [1.0]
        height: 0.34
        description: "1컷 전폭 - 결과·여운. 말줄임표 또는 무자막"
        gen:
          - {shot: upper_body, angle: high, chars: 2, bg: tone, text: mono, ask: "두 사람, 위에서 본 구도, 여백 넓게"}

  # ───────────────────────── 5) 3단 5컷 · 협폭 샌드위치 (실측 10면)
  # 가운데 전폭 행을 사이에는고 위·아래를 2컷씩 — 앞뒤 대화 사이에 삽입 하나를 끼우는 문법.
  - id: std_3tier_5panel_sandwich
    name: "3단 5컷 · 가운데 삽입"
    situations: ["승", "전"]
    total_size: "1 Page"
    total_tiers: 3
    observed: 10
    gen_page: "가운데 전폭 컷은 삽입(interior/소품/배경)으로도 씁니다. 위·아래 행은 얼굴~상체 위주(행 높이가 낮음)."
    tier_details:
      - tier: 1
        shares: [0.55, 0.45]
        height: 0.35
        description: "2컷 분할(55/45) - 대화 두 수"
        gen:
          - {shot: bust,    angle: eye_level, chars: 1, bg: simple, text: dialog}
          - {shot: bust,    angle: eye_level, chars: 1, bg: simple, text: dialog}
      - tier: 2
        shares: [1.0]
        height: 0.32
        description: "1컷 전폭 - 삽입 컷(장면의 핵심 사물·공간)"
        gen:
          - {shot: scenery, angle: eye_level, chars: 0, bg: detailed, text: none, ask: "인물 없는 배경·사물 클로즈업도 허용"}
      - tier: 3
        shares: [0.5, 0.5]
        height: 0.33
        description: "2컷 분할(50/50) - 삽입을 보고 바뀌는 반응"
        gen:
          - {shot: closeup,    angle: eye_level, chars: 1, bg: simple, text: none}
          - {shot: upper_body, angle: eye_level, chars: 1, bg: simple, text: dialog}

  # ───────────────────────── 6) 2단 4컷 비대칭 (실측 20면, 타치키리 95%)
  # 행 0.47/0.53, 행 안 60:40. 컷 수가 줄어 속도가 붙는 구성 — 진행과 리액션을 좌우로 병렬 배치.
  - id: asym_2tier_4panel
    name: "2단 4컷 비대칭"
    situations: ["승", "전"]
    total_size: "1 Page"
    total_tiers: 2
    observed: 20
    gen_page: "2단 모두 좌우로 나뉩니다(60:40). 작은 칸은 얼굴·손 등 한 가지 정보만 담을 것."
    tier_details:
      - tier: 1
        shares: [0.6, 0.4]
        height: 0.47
        description: "2컷 분할(60/40) - 진행(큰 칸)과 상대의 표정(작은 칸)"
        gen:
          - {shot: upper_body, angle: eye_level, chars: 2, bg: simple, text: dialog}
          - {shot: closeup,    angle: eye_level, chars: 1, bg: black,  text: none}
      - tier: 2
        shares: [0.55, 0.45]
        height: 0.53
        description: "2컷 분할(55/45) - 행동의 결과와 반동"
        gen:
          - {shot: full_body, angle: eye_level, chars: 2, bg: simple, text: sfx, ask: "몸 전체가 보이는 동작, 효과문자 자리 확보"}
          - {shot: bust,      angle: low,       chars: 1, bg: tone,   text: dialog}

  # ───────────────────────── 7) 2단 2컷 전폭 (실측 12면, 행 높이 0.58/0.42)
  # 컷 2개로만 읽히는 페이지. 앞 행은 넓게 열어 제시, 뒤 행은 좁혀서 찍어 누릅니다.
  - id: split_2tier_2panel
    name: "2단 2컷 전폭 (0.58/0.42)"
    situations: ["기", "결"]
    total_size: "1 Page"
    total_tiers: 2
    observed: 12
    gen_page: "컷이 두 개뿐이므로 각 컷이 페이지의 절반 이상을 차지합니다. 디테일·인물 수를 과도하게 담지 말 것."
    tier_details:
      - tier: 1
        shares: [1.0]
        height: 0.58
        description: "전폭 1컷(58%) - 제시. 넓은 시야"
        gen:
          - {shot: full_body, angle: eye_level, chars: 2, bg: detailed, text: dialog, ask: "머리~발끝, 배경까지 포함한 상황"}
      - tier: 2
        shares: [1.0]
        height: 0.42
        description: "전폭 1컷(42%) - 받아치기. 위에서 아래로 눌러 마무리"
        gen:
          - {shot: bust,    angle: high, chars: 1, bg: simple, text: mono, ask: "얼굴·상체 클로즈업, 배경 단순"}

  # ───────────────────────── 8) 2단 3컷 · 위 분할/아래 전폭 (실측 12면)
  - id: top_split_bottom_full
    name: "2단 3컷 · 위 분할/아래 전폭"
    situations: ["기", "승"]
    total_size: "1 Page"
    total_tiers: 2
    observed: 12
    gen_page: "위 행은 두 사람의 다른 시점, 아래 행은 그것을 한데 묶는 전폭 컷."
    tier_details:
      - tier: 1
        shares: [0.58, 0.42]
        height: 0.50
        description: "2컷 분할(58/42) - 두 인물이 각자 하는 행동"
        gen:
          - {shot: upper_body, angle: eye_level, chars: 1, bg: detailed, text: dialog}
          - {shot: bust,       angle: high,      chars: 1, bg: simple,   text: none}
      - tier: 2
        shares: [1.0]
        height: 0.50
        description: "1컷 전폭 - 두 동선을 하나로 합치는 장면 전환 컷"
        gen:
          - {shot: full_body, angle: high, chars: 2, bg: detailed, text: mono, ask: "조망 구도, 두 사람 다 머리~발끝"}

  # ───────────────────────── 9) 2단 3컷 · 위 전폭/아래 분할 (실측 8면)
  # 첫 컷을 넓게 열고 아래에서 좁혀 세부로 들어가는 도입 문법(행 높이 0.62/0.38).
  - id: top_full_bottom_split
    name: "2단 3컷 · 위 전폭/아래 분할"
    situations: ["기", "전"]
    total_size: "1 Page"
    total_tiers: 2
    observed: 8
    gen_page: "위 컷(62%)은 배경·공간 중심. 아래 두 칸은 배경을 단순화해 얼굴·소품으로 진입."
    tier_details:
      - tier: 1
        shares: [1.0]
        height: 0.62
        description: "전폭 1컷(62%) - 공간 제시(인물 없어도 됨)"
        gen:
          - {shot: scenery, angle: eye_level, chars: 0, bg: detailed, text: mono, ask: "인물 없는 풍경, 설명 박스 자리 확보"}
      - tier: 2
        shares: [0.62, 0.38]
        height: 0.38
        description: "2컷 분할(62/38) - 세부 진입: 인물과 소품"
        gen:
