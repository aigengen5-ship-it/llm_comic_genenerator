  그녀에게 각인시키려 한다.
- 과호흡으로 고통스러워하는 딸의 손을 꽉 맞잡으며 불안감을 잠재우는 동시에 육체적인 지배력을 확인한다. 패닉 상태에서 자신만을 바라보는 하루카의 눈동자를 보며, 밀실 속에서는 오직 자신의 명령과 손길만이 절대적이라는
  사실에 희열을 느낀다.
- 인공호흡을 빌미로 과감하게 $키스 를 감행하며 하루카의 이성을 흔든다. 그녀가 타락의 문턱에서 발을 멈추려 애쓰면서도 몸은 정직하게 반응하는 모습에 더욱 강한 성적 자극을 느끼며, 서서히 무너져 내리는 딸의 모습에
  깊은 만족감을 느낀다.
- 딸이 장난스럽게 자신을 결박하자 처음에는 허허 웃으며 넘기려 하지만, 문틈으로 새어 들어오는 빛 아래에서 $공개펠라치오 를 시도하는 하루카의 대담함에 강렬한 정복욕을 느낀다. 천박하게 낄낄거리면서도 그녀의 머리카락을
  움켜쥐고 리드하며 금기를 깨뜨리는 배덕감을 극대화한다.
- 이온 음료를 통해 전달되는 간접키스에 하루카가 느끼는 떨림을 감지한다. 이제 그녀가 자신과 같은 수준으로 타락했다는 확신을 가지고, 일부러 더 강압적인 말투와 행동으로 압박하며 이곳이 오직 자신의 뜻대로 움직이는 낙원임을
  인식시킨다.
- 진실게임 도중 하루카가 내뱉는 음란한 취향들에 경악하면서도 그 모습에 더욱 반응하는 딸의 신체적 변화를 관찰한다. $펠라치오 중 허벅지가 가늘게 떨리고 낮게 신음하며 자신의 정액을 모두 삼키는 그녀의 헌신적인 모습에
  수컷으로서의 본능이 폭발한다.
- 아침 햇살 아래 잠에서 깨어 하루카와 키스를 나누다 그녀의 유륜 색이 진해진 것을 발견하고 회심의 미소를 짓는다. 자신의 손길에 의해 신체적으로 변해가고 있다는 사실에 희열을 느끼며, 이성으로 저항하려는 그녀를 비웃듯
  더욱 집요하게 애무하여 몸부터 완전히 굴복시킨다.
- 잠결에 다리 사이로 파고드는 하루카의 뜨거운 온기에 본능적으로 반응한다. $기승위 자세로 자신을 탐하는 딸의 적극적인 모습에서 완전한 의존성을 확인하고, 이어 그녀를 뒤집어 엎어 격렬한 $후배위 를 나누며 하복부에
  정액이 가득 차오르는 감각과 함께 지배력을 각인시킨다.
- 밤새도록 이어지는 은밀한 대화 속에서 하루카가 느끼는 정서적 유대감을 이용한다. 내 품 안에 가두고 사랑하는 것이 진정한 행복이라는 식으로 그녀를 설득하며, 사회적 관계를 끊어내고 오직 자신만을 바라보게 만드는 야쿠자
  보스 특유의 소유욕을 실천한다.
- 잠시 자리를 비웠다 돌아왔을 때, 운동기구를 이용해 $공개자위 를 하던 하루카의 음란한 모습을 목격하고 극심한 성적 흥분을 느낀다. 다리를 벌린 채 뜀틀에 기대어 스스로를 탐하는 모습에 이성이 끊길 듯한 자극을 받으며,
  강렬한 $공개딥키스 로 그녀의 욕망을 강제한다.
- 하루카가 일시적으로 탈출하여 돌아왔을 때 예상했다는 듯 여유롭게 맞이한다. 정갈한 사회의 삶보다 자신의 품속에서 느끼는 천박한 쾌락이 훨씬 우월하다는 것을 깨닫게 해주며, 이제는 되돌아갈 수 없는 강을 건넌 딸을 비웃으며
  완전히 소유한다.
- 죽음의 공포를 핑계로 매달리는 하루카를 보며 그녀가 마침내 이성과 도덕을 모두 버렸음을 확신한다. $정상위 에 이어 벽에 기대어 다리를 걸친 $기립성교 로 전환하며, 자궁 입구까지 깊숙이 자신의 씨앗을 쏟아내는 사정을
  통해 완전한 각인과 지배를 완성한다.
- 관계 후 자신에게 완전히 매달려 체취에 중독된 하루카를 보며 깊은 만족감을 느낀다. 이제 그녀가 사회적 상식을 가진 은행원이 아니라, 오직 자신의 사랑과 쾌락만을 갈구하는 암컷노예가 되었음을 깨닫고 앞으로 펼쳐질 더
  깊은 타락을 계획한다.
- 완전히 조교 된 딸이 보관함 속으로 자신을 이끄는 모습에 강렬한 정복욕을 느낀다. 비좁은 공간에서 하루카가 $얼굴앉기 를 통해 자신의 얼굴을 압박해올 때, 그녀의 진하고 달콤한 체취와 젖어있는 감촉에 흥분하여 거칠게
  탐한다. 결국 자궁 깊숙이 뜨거운 정액을 가득 채우는 질내사정을 하며 최상위 지배욕을 충족시킨다.
- 배구공을 주우려다 손이 맞닿았을 때, 자신만을 바라보는 하루카의 눈동자가 이미 이성을 잃고 오직 성욕과 애정으로만 가득 차 있음을 발견하고 만족스럽게 웃는다. 스마트폰 녹화라는 장치를 통해 $공개딥키스 를 나누며,
  이제는 그 어떤 도덕적 제약도 없는 자신들만의 왕국을 확신한다.
- 옷가지마저 다 벗어 던지고 알몸으로 자신의 발치에서 암컷처럼 구는 하루카를 보며 극도의 희열을 느낀다. 교미 루틴 중 $다리들기 자세로 그녀를 유린하고, 특히 구조대원이 문을 여는 순간에 맞춰 $공개애널색스 를 감행함으로써
  외부인에게 자신의 소유물을 과시한다. 얼굴과 가슴 위에 정액을 흩뿌리는 사정을 하며 완전한 타락의 마침표를 찍는다.
- 문이 열렸음에도 불구하고 자신에게 매달려 떨어질 줄 모르는 하루카의 모습에서 완전한 승리를 느낀다. 사회적 지위와 이성을 모두 잃고 오직 자신의 품만을 갈구하는 백치 같은 딸을 보며, 그녀를 다시는 세상 밖으로 내보내지
  않고 영원히 자신만의 비밀스러운 애완동물로 키우겠다고 다짐한다.
