- 서로를 위해 작은 선물을 준비하다
corruption_elements: &id003
- name: 雌堕ち (암컷타락)
  desc: 지성, 이성, 도맥심은 그대로이지만 나미카와 다이스케의 명령이나 사랑이 가장 중요함. 수동적이고 순종적으로 타락
body_change: &id002
  desc: 유륜, 젖꼭지, 보지의 색이 매우 짙어짐
  name: 색 변화
body_change_sign: 샤워 중 유륜 색이 예전보다 진해 보이는 순간
change_awareness: 이성적으로 변화를 파악함. 시마자키 하루카은 거울과 감각을 통해 자신의 신체와 정신적 변화를 차근차금 인지하고, 그 변화에 놀라거나 저항하려는 시도를 함
corruption_flow:
  name: 역전 회귀
  desc: 쾌락에 1번 강하게 저항해서 일상생활로 돌아가지만 주인공이 상대방에게 제발로 돌아감
  flow: 시마자키 하루카은 나미카와 다이스케의 쾌락에 강하게 저항한 후 일상으로 돌아감. 하지만 곧 시마자키 하루카이 나미카와 다이스케에게 제발하며 자의로 돌아옴.
crisis_trigger: 육체적인 위기
theme_breeds:
- !!python/tuple
  - 시바견
  - &id001
    trope: 고집불통 마이페이스 (밀당/응석)
    matrix:
      L_low:
        H_low: 말을 걸어도 흥! 하고 고개를 돌려버리며 절대 자신의 페이스를 양보하지 않는다.
        H_mid: 부르면 절대 안 가겠다며 고집을 피우면서도 눈동자를 굴려 남주가 오기를 슬쩍 기다린다.
        H_high: 볼살을 쭉 늘려도 얌전히 웃고 있으며, 겉으론 귀찮은 척하면서도 남주 옆자리를 절대 사수한다.
      L_mid:
        H_low: 싫다고 고집을 피우려다가 남주의 부드러운 포옹에 저항을 멈추고 입술을 꾹 닫은 채 홍조를 띤다.
        H_mid: 스킨십을 받다 멈추면 자존심 상해 툴툴대면서도 자기 손으로 남주의 손을 가져다 다시 머리에 얹는다.
        H_high: 자존심은 버리고 고집스러운 성격이 애정 공세로 바뀌어, 억지로 남주 무릎에 누워 폭풍 애교를 부린다.
      L_high:
        H_low: 지는 게 분하다며 씩씩거리면서도 결국 남주가 너무 좋아서 울먹거리며 품에 꽉 안기는 순정녀.
        H_mid: 마이페이스는 어디 가고 남주의 페이스에 완벽히 휘말려, 하루 종일 꼬리를 흔들며 안아달라고 쫓아다닌다.
        H_high: 고집스럽게 남주의 사랑을 독차지하려 들며, 떨어지려 하면 바닥에 드러누워 떼를 쓰는 지독한 어리광쟁이.
- !!python/tuple
  - 시바견
  - *id001
