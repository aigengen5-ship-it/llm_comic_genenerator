corruption_guides:
- 다이스케와 자금 세탁 문제로 격렬하게 말다툼하며 도착한 제1 체육창고의 문이 갑자기 잠긴다. 창문 하나 없는 폐쇄적인 공간에서 당황한 하루카는 탈출구를 찾기 위해 높은 천장의 환풍구를 확인하려 한다. 그녀는 내키지
  않는 표정으로 다이스케의 어깨 위로 목말을 타게 되고, 그 과정에서 자신의 허벅지 안쪽 여린 살에 아버지의 귀가 닿자 예상치 못한 자극에 순간적으로 다리에 힘이 풀리며 몸이 떨린다. 평소 말다툼 직후라 극도로 긴장되어
  있던 교감신경이 갑작스러운 신체 밀착으로 인해 과부하를 일으키며, 단순한 접촉임에도 뇌가 강렬한 전기 자극처럼 받아들이는 경험을 한다.
- 탈출 불가능을 깨달은 하루카는 불안감을 해소하기 위해 창고 한복판에 놓인 낡은 가죽 뜀틀 위에 날카로운 금속 조각으로 자신의 이름과 다이스케의 이름을 나란히 새긴다. 이 행위를 통해 이곳이 이제 외부와 단절된 두 사람만의
  영역이라는 사실을 무의식적으로 각인하며, 분노했던 마음 뒤편으로 묘한 소유욕과 폐쇄감이 주는 안도감을 느끼기 시작한다.
- 습하고 더운 공기로 인해 다이스케의 목덜미에 땀이 흐르는 것을 본 하루카는 은행원 시절부터 쓰던 부드러운 실크 소재의 흰색 손수건을 꺼내 조심스럽게 그를 닦아준다. 이때 서로의 시선이 노골적으로 얽히며 평소의 부녀
  관계에서는 느낄 수 없었던 성적인 긴장감이 흐르고, 그녀는 가물거리는 기억 속에 지난번 아버지 사무실 면담실에 단둘이 남아 날씨 이야기만 짧게 나누던 어색한 침묵을 떠올린다. 그때보다 훨씬 좁고 농밀해진 현재의 공간감에
  압도되어 자신도 모르게 침을 삼키며 그의 단단한 목 근육에 가벼운 $애무 수준의 접촉을 이어간다.
- 갑자기 외부에서 체육 교사의 순찰 소리가 들리는 대신, 고무 매트를 통해 전달되는 미세한 발소리의 진동이 발바닥을 타고 울려온다. 하루카는 당황하여 다이스케와 함께 거대한 뜀틀 뒤 비좁은 틈새로 몸을 구겨 넣는다.
